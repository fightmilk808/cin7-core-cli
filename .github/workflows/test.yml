name: test
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      # Mock server only: CIN7_BASE_URL is pointed at 127.0.0.1 by the test fixtures.
      - run: pytest -q --cov=cin7_cli --cov-fail-under=80
